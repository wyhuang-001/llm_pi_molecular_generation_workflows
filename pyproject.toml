[project]
name = "simple-molecular-agent"
version = "0.1.0"
description = "Minimal LLM-guided protein-ligand editing workflow"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "rdkit>=2025.03",
  "gemmi>=0.7",
  "pydantic>=2.9",
]

[project.scripts]
molecular-agent = "molecular_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
